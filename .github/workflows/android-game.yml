name: Android NOVATERRA game build
on:
  push:
    paths:
      - 'prepare-luanti.py'
      - 'offline_mainmenu.py'
      - 'assets/branding/generate_menu_landscape.py'
      - 'res/**'
      - 'games/novaterra/**'
      - 'tests/**'
      - '.github/workflows/source-validation.yml'
      - '.github/workflows/android-game.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novaterra-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: novaterra-gradle-${{ runner.os }}-luanti-5.17.0-${{ hashFiles('prepare-luanti.py', 'offline_mainmenu.py') }}
          restore-keys: |
            novaterra-gradle-${{ runner.os }}-luanti-5.17.0-
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME"/cmdline-tools/*
      - name: Install native Android build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext ninja-build cmake unzip
      - name: Check out pinned Luanti native engine 5.17.0
        run: git clone --branch 5.17.0 --depth 1 https://github.com/luanti-org/luanti.git build/luanti
      - name: Brand Android client and bundle the full NOVATERRA game
        run: python3 prepare-luanti.py --luanti build/luanti --project .
      - name: Verify patched engine is offline-only
        shell: bash
        run: |
          set -euo pipefail
          MENU="build/luanti/builtin/mainmenu/init.lua"
          LOCAL="build/luanti/builtin/mainmenu/tab_local.lua"
          test -s "$MENU" && test -s "$LOCAL"
          grep -Fq -- "NOVATERRA offline: online servers are unavailable" "$MENU"
          grep -Fq -- "NOVATERRA offline: no content downloads" "$MENU"
          ! grep -Fq -- 'tv_main:add(tabs.play_online)' "$MENU"
          ! grep -Fq -- 'tv_main:add(tabs.content)' "$MENU"
          ! grep -Fq -- 'check_new_version()' "$MENU"
          ! grep -Fq -- 'btnbar:add_button("game_open_cdb"' "$LOCAL"
          grep -Fq -- 'disabled_settings = enable_server' build/luanti/games/novaterra/game.conf
      - name: Compile arm64 native Android debug APK and test AAB
        shell: bash
        working-directory: build/luanti/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace
      - name: Inspect APK, bundled game assets and Android manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=$(find build/luanti/android/app/build/outputs/apk -name '*arm64-v8a*debug.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > artifacts/android-badging.txt
          EXPECTED_VERSION_CODE=20006
          grep -q "package: name='com.brendigo.novaterra' versionCode='$EXPECTED_VERSION_CODE'" artifacts/android-badging.txt
          grep -q "versionName='0.0.6'" artifacts/android-badging.txt
          grep -q "application-label:'NOVATERRA'" artifacts/android-badging.txt
          unzip -p "$APK" assets/assets.zip > artifacts/novaterra-game-assets.zip
          unzip -t artifacts/novaterra-game-assets.zip >/dev/null
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/game.conf'
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/menu/background.png'
          unzip -p artifacts/novaterra-game-assets.zip games/novaterra/menu/background.png > artifacts/menu-background.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path("artifacts/menu-background.png").read_bytes()
          assert data.startswith(b"\\x89PNG\\r\\n\\x1a\\n")
          assert struct.unpack(">II", data[16:24]) == (1440, 810)
          assert len(data) > 15000
          PY
          rm artifacts/menu-background.png
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/mods/nv_core/textures/nv_stone.png'
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/mods/nv_world/textures/nv_coal_overlay.png'
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'minetest.conf'
          unzip -p artifacts/novaterra-game-assets.zip minetest.conf | grep -Fx 'hud_scaling = 0.9'
          unzip -p artifacts/novaterra-game-assets.zip minetest.conf | grep -Fx 'menu_last_game = novaterra'
          unzip -p artifacts/novaterra-game-assets.zip minetest.conf | grep -Fx 'enable_server = false'
          unzip -p artifacts/novaterra-game-assets.zip minetest.conf | grep -Fx 'serverlist_url = '
          unzip -p artifacts/novaterra-game-assets.zip builtin/mainmenu/init.lua | grep -Fq -- 'NOVATERRA offline: online servers are unavailable'
          if unzip -p artifacts/novaterra-game-assets.zip builtin/mainmenu/init.lua | grep -Fq -- 'tv_main:add(tabs.play_online)'; then
            echo "Public server button leaked into packaged APK" >&2
            exit 1
          fi
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/mods/nv_mobs/init.lua'
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'builtin/mainmenu/novaterra_world_details.lua'
          unzip -p artifacts/novaterra-game-assets.zip builtin/mainmenu/novaterra_world_details.lua | grep -Fq -- 'PODACI SE CITAJU IZ LOKALNOG'
          unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx 'games/novaterra/mods/nv_rpg/init.lua'
          for icon in nv_health_full.png nv_health_empty.png nv_hunger_full.png nv_hunger_empty.png; do
            unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Fx "games/novaterra/mods/nv_survival/textures/$icon"
          done
          IMAGE_COUNT=$(unzip -Z1 artifacts/novaterra-game-assets.zip | grep -Ec '^games/novaterra/mods/[^/]+/textures/[^/]+[.]png$')
          if [[ "$IMAGE_COUNT" -ne 21 ]]; then
            echo "Expected 21 NOVATERRA PNG assets; found $IMAGE_COUNT" >&2
            exit 1
          fi
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/.*[.]so'
          if unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/.*[.]so'; then
            echo "Unexpected non-arm64 library" >&2
            exit 1
          fi
          cp "$APK" artifacts/NOVATERRA-Android-arm64-v0.0.6-debug.apk
          AAB=$(find build/luanti/android/app/build/outputs/bundle -type f -name '*debug.aab' | head -1)
          test -n "$AAB"
          unzip -t "$AAB" >/dev/null
          cp "$AAB" artifacts/NOVATERRA-Android-v0.0.6-debug.aab
          rm artifacts/novaterra-game-assets.zip
          (cd artifacts && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: NOVATERRA-Android-arm64-v0.0.6-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

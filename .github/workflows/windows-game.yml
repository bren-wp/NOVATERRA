name: Windows portable NOVATERRA game
on:
  push:
    paths:
      - 'games/novaterra/**'
      - 'windows/**'
      - 'android/**'
      - '.github/workflows/android-game.yml'
      - '.github/workflows/windows-game.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-win-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate complete NOVATERRA game data
        shell: pwsh
        run: |
          ./windows/Check-NOVATERRA.ps1
          $textures = @(Get-ChildItem -Path games/novaterra -Recurse -Filter '*.png')
          if ($textures.Count -ne 21) { throw "Expected 21 game PNG assets; got $($textures.Count)" }
      - name: Download and verify Luanti 5.17.0 64-bit portable engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $url = "https://github.com/luanti-org/luanti/releases/download/5.17.0/luanti-5.17.0-win64.zip"
          & curl.exe -fL --retry 3 --retry-delay 3 -o build/luanti-win64.zip $url
          if ($LASTEXITCODE -ne 0) { throw "Luanti portable engine download failed" }
          $actual = (Get-FileHash build/luanti-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "3ce20c77f5c206a988d7a6b883439e2759e3cf67428c9dbcf99ecd2936da631c"
          if ($actual -ne $expected) { throw "Luanti engine SHA256 mismatch: $actual" }
          Expand-Archive -Path build/luanti-win64.zip -DestinationPath build/engine-unpacked -Force
      - name: Publish compiled NOVATERRA Windows launcher
        shell: pwsh
        run: |
          dotnet publish windows/NOVATERRA.Launcher/NOVATERRA.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o build/launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path build/launcher/NOVATERRA.exe)) { throw "Launcher EXE missing" }
      - name: Assemble complete Windows game distribution
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/engine-unpacked -Recurse -File -Filter luanti.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if ($null -eq $exe) { throw "Luanti executable not found in verified release archive" }
          $engineRoot = Split-Path $exe.Directory.FullName -Parent
          New-Item -ItemType Directory -Force -Path build/staging/NOVATERRA/engine | Out-Null
          Copy-Item -Path (Join-Path $engineRoot '*') -Destination build/staging/NOVATERRA/engine -Recurse -Force
          Copy-Item -LiteralPath build/launcher/NOVATERRA.exe -Destination build/staging/NOVATERRA/NOVATERRA.exe
          New-Item -ItemType Directory -Force -Path build/staging/NOVATERRA/games | Out-Null
          Copy-Item -Path games/novaterra -Destination build/staging/NOVATERRA/games -Recurse -Force
          Copy-Item -LiteralPath LICENSE -Destination build/staging/NOVATERRA/LICENSE-NOVATERRA.txt
          if (!(Test-Path build/staging/NOVATERRA/engine/bin/luanti.exe)) { throw "Engine binary was not packaged" }
          if (!(Test-Path build/staging/NOVATERRA/games/novaterra/game.conf)) { throw "Game config was not packaged" }
          $packagedTextures = @(Get-ChildItem build/staging/NOVATERRA/games/novaterra -Recurse -Filter '*.png')
          if ($packagedTextures.Count -ne 21) { throw "Packaged textures missing" }
      - name: Smoke-check native Luanti engine
        shell: pwsh
        run: |
          $output = (& build/staging/NOVATERRA/engine/bin/luanti.exe --version 2>&1 | Out-String)
          Write-Host $output
          if (-not $output.Contains('Luanti 5.17.0 (Windows)')) { throw "Native engine version or platform could not be verified" }
          if ($LASTEXITCODE -notin @(0, 1)) { throw "Native engine terminated unexpectedly: $LASTEXITCODE" }
      - name: Launch NOVATERRA.exe and verify engine process startup
        shell: pwsh
        run: |
          $launcher = (Resolve-Path 'build/staging/NOVATERRA/NOVATERRA.exe').Path
          $process = Start-Process -FilePath $launcher -ArgumentList '--version' -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "NOVATERRA launcher failed to finish startup self-check"
          }
          if ($process.ExitCode -ne 0) {
            throw "NOVATERRA launcher failed with exit code $($process.ExitCode)"
          }
      - name: Build self-contained portable single EXE with bundled game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'build/staging/NOVATERRA/*' -DestinationPath 'windows/NOVATERRA.Portable/GameBundle.zip' -CompressionLevel Optimal
          if (!(Test-Path 'windows/NOVATERRA.Portable/GameBundle.zip')) { throw "Bundled engine and game ZIP missing" }
          dotnet publish windows/NOVATERRA.Portable/NOVATERRA.Portable.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o build/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portableExe = 'build/portable/NOVATERRA-Portable.exe'
          if (!(Test-Path $portableExe)) { throw "Standalone portable EXE missing" }
          Copy-Item -LiteralPath $portableExe -Destination artifacts/NOVATERRA-Windows-Portable-v1.2.0-dev.exe -Force
      - name: Smoke-launch embedded portable EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'artifacts/NOVATERRA-Windows-Portable-v1.2.0-dev.exe').Path -ArgumentList '--version' -PassThru
          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Standalone portable executable did not finish --version test"
          }
          if ($process.ExitCode -ne 0) {
            throw "Standalone portable executable startup failed: $($process.ExitCode)"
          }
      - name: Compile Windows Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path -LiteralPath $iscc)) { throw "ISCC.exe is missing" }
          & $iscc "/Qp" "windows/novaterra.iss"
          if ($LASTEXITCODE -ne 0) { throw "NOVATERRA setup compilation failed" }
          if (!(Test-Path artifacts/NOVATERRA-Windows-Setup-v1.2.0-dev.exe)) {
            throw "Setup EXE was not generated"
          }
      - name: Package and checksum portable Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path build/staging/NOVATERRA -DestinationPath artifacts/NOVATERRA-Windows-x64-v1.2.0-dev.zip -CompressionLevel Optimal
          $zip = Get-Item artifacts/NOVATERRA-Windows-x64-v1.2.0-dev.zip
          if ($zip.Length -lt 1000000) { throw "Windows game archive is unexpectedly small" }
          $setup = Get-Item artifacts/NOVATERRA-Windows-Setup-v1.2.0-dev.exe
          if ($setup.Length -lt 1000000) { throw "Windows installer is unexpectedly small" }
          $portable = Get-Item artifacts/NOVATERRA-Windows-Portable-v1.2.0-dev.exe
          if ($portable.Length -lt 1000000) { throw "Standalone portable executable unexpectedly small" }
          $packages = @($zip, $setup, $portable)
          $sums = @($packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "NOVATERRA Windows package: $($_.Name) $($_.Length) bytes SHA256=$hash"
            "$hash  $($_.Name)"
          })
          $sums | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: NOVATERRA-Windows-x64-v1.2.0-dev
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

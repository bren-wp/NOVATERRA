name: Import original NOVATERRA source
on:
  push:
    paths:
      - 'imports/novaterra-v1.1.0-source.tar.xz.b64'
      - 'scripts/import_source.py'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and import the original source archive
        run: python3 scripts/import_source.py
      - name: Install Lua parser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Validate imported Lua code and assets
        shell: bash
        run: |
          set -euo pipefail
          find games/novaterra -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          python3 -m unittest discover -s tests -p 'test*.py' -v
          python3 tests/check_source.py
          echo 'Original asset manifest:'
          find games/novaterra -name '*.png' | sort
          test "$(find games/novaterra -name '*.png' | wc -l)" -eq 17
      - name: Commit verified game source and textures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/novaterra tests
          if git diff --cached --quiet; then
            echo 'Source is already synchronized'
          else
            git commit -m "feat: import all original v1.1.0 Luanti gameplay assets and tests"
            git push origin HEAD:main
          fi

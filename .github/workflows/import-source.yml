name: Verify archived NOVATERRA v1.1 source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-historical-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import archived source into an isolated temporary folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/novaterra-archive"
          python3 scripts/import_source.py --root "$RUNNER_TEMP/novaterra-archive"
          test "$(find "$RUNNER_TEMP/novaterra-archive/games/novaterra" -type f -name '*.png' | wc -l)" -eq 17
          test -s "$RUNNER_TEMP/novaterra-archive/games/novaterra/game.conf"
      - name: Verify original Lua source without modifying the active game
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find "$RUNNER_TEMP/novaterra-archive/games/novaterra" -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          echo "Archived v1.1.0 gameplay was verified in isolation."

name: Source validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 parser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Validate Lua syntax and source structure
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s games/novaterra/game.conf
          for mod in nv_core nv_survival nv_ui nv_world; do
            test -s "games/novaterra/mods/$mod/mod.conf"
            test -s "games/novaterra/mods/$mod/init.lua"
          done
          test -s games/novaterra/mods/nv_world/furnace.lua
          find games/novaterra -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          lua5.1 tests/test_endless_progression.lua
          lua5.1 tests/test_rpg_building.lua
          lua5.1 tests/test_mobile_ui.lua
          lua5.1 tests/test_landscapes.lua
          lua5.1 tests/test_survival_hud.lua
          lua5.1 tests/test_ui_actions.lua
          luac5.1 -p novaterra_home.lua novaterra_world_details.lua novaterra_worlds.lua
          lua5.1 tests/test_world_details.lua
          lua5.1 tests/test_world_selection.lua
          lua5.1 tests/test_home_navigation.lua
  assets-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original textures and source tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v

name: Source validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          if [ -d games/novaterra ]; then
            test -f games/novaterra/game.conf
            sudo apt-get update -qq
            sudo apt-get install -y -qq lua5.1
            find games/novaterra -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          else
            echo "Prototype source not imported yet; runtime/build checks are pending."
          fi
